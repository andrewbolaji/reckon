name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          pip install -r ingest/requirements-dev.txt
          pip install -r copilot/requirements.txt

      - name: Run extractor tests
        run: pytest ingest/tests/ -v

      - name: Run copilot unit tests (no DB required)
        run: pytest copilot/tests/test_trust_gate.py::TestSqlValidation copilot/tests/test_trust_gate.py::TestRowCap copilot/tests/test_tools.py::TestDescribeSchema copilot/tests/test_security.py::TestSqlInjection -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Run dashboard tests
        working-directory: dashboard
        run: npx vitest run

  # Kept in its own job: the API image builds from api/ alone, so its
  # dependencies are installed alone too.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: |
          pip install -r api/requirements.txt
          pip install pytest==8.3.2

      - name: Run API tests
        run: pytest api/tests -v

  lint-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core==1.8.7 dbt-postgres==1.8.2

      - name: dbt deps
        working-directory: transform
        run: dbt deps --profiles-dir .

      - name: dbt parse (syntax check)
        working-directory: transform
        run: dbt parse --profiles-dir .

  # Orchestration gets its own job so dagster-dbt's hard pins cannot collide
  # with the copilot and API dependency sets in the `test` job.
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One resolver call, not four sequential ones. dbt's dependencies cap
      # protobuf below 5.0, and separate `pip install` calls don't re-resolve
      # already-installed transitive packages against a later call's
      # constraints: split across calls, pip can leave an unpinned dagster
      # dependency (grpcio-health-checking) on a release that needs a newer
      # protobuf than dbt allows, and `dagster definitions validate` fails
      # with an ImportError with nothing pointing at a version conflict.
      - name: Install orchestration deps
        run: |
          pip install -r orchestration/requirements.txt -r ingest/requirements.txt \
            dbt-core==1.8.7 dbt-postgres==1.8.2 pytest==8.3.2

      - name: Build the dbt manifest
        working-directory: transform
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .

      # The gate: the code location must load, with every asset, job, schedule,
      # and sensor resolvable. Exits non-zero on any definition error.
      - name: Validate Dagster definitions
        run: dagster definitions validate -m orchestration.definitions

      - name: Run orchestration tests
        run: pytest orchestration/tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline image
        run: docker build --platform linux/amd64 -t reckon-pipeline:ci -f infra/docker/pipeline.Dockerfile .

      - name: Smoke-test pipeline image
        run: docker run --rm --platform linux/amd64 reckon-pipeline:ci dagster definitions validate -m orchestration.definitions

      - name: Build API image
        run: docker build --platform linux/amd64 -t reckon-api:ci -f api/Dockerfile api/

      - name: Smoke-test API image
        run: docker run --rm --platform linux/amd64 reckon-api:ci python -c "import main; assert main.app.title == 'Reckon API'"

      - name: Build dashboard image
        run: docker build --platform linux/amd64 -t reckon-dashboard:ci -f dashboard/Dockerfile dashboard/

      - name: Smoke-test dashboard image
        run: |
          container=$(docker run -d --rm --platform linux/amd64 -p 8080:8080 reckon-dashboard:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..10}; do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          docker logs "$container"
          exit 1

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform validate

      - name: Lint application chart
        run: helm lint infra/helm/reckon

      - name: Render chart with and without monitoring CRDs
        run: |
          helm template reckon infra/helm/reckon > /tmp/reckon-no-crd.yaml
          helm template reckon infra/helm/reckon \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor \
            > /tmp/reckon-with-crd.yaml
          test "$(grep -c 'kind: ServiceMonitor' /tmp/reckon-no-crd.yaml || true)" -eq 0
          test "$(grep -c 'kind: ServiceMonitor' /tmp/reckon-with-crd.yaml)" -eq 2
          test "$(grep -c 'kind: Secret' /tmp/reckon-with-crd.yaml || true)" -eq 0
          ! grep -E 'POSTGRES_PASSWORD|REDSHIFT_PASSWORD' /tmp/reckon-with-crd.yaml

      - name: Prove a missing freshness metric fires
        run: |
          docker run --rm \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.53.0 \
            test rules /etc/prometheus/alerts.test.yml
