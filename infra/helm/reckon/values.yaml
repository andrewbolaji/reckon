# ---- Images ----
images:
  pipeline: reckon-pipeline:latest
  api: reckon-api:latest
  dashboard: reckon-dashboard:latest
  pullPolicy: IfNotPresent

# ---- Warehouse ----
warehouse:
  # Created outside Helm so credentials never enter release values, rendered
  # manifests, or release history. `make helm-install` creates it from the
  # caller's environment without putting the password in process arguments.
  existingSecret: ""
  # Non-secret Kubernetes resourceVersion used to roll the API after rotation.
  secretRevision: ""

# ---- Pipeline CronJob ----
pipeline:
  schedule: "0 */6 * * *"   # Every 6 hours
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  dbtTarget: prod
  bootstrap:
    enabled: true
    activeDeadlineSeconds: 900

# ---- Monitoring (in-cluster Prometheus scraping) ----
# When enabled, the app exposes Prometheus metrics and ships ServiceMonitors so
# the kube-prometheus-stack Prometheus scrapes them. The API serves OTel metrics
# on :9464; the pipeline pushes to an in-cluster Pushgateway (below), which
# Prometheus then scrapes. ServiceMonitors render only when their CRD is
# available, so the application chart can also install without monitoring.
monitoring:
  enabled: true
  metricsPort: 9464
  pushgateway:
    image: prom/pushgateway:v1.9.0
    port: 9091

# ---- MongoDB (seeded demo source for the pipeline's job records) ----
# Optional in-cluster mongo:7, seeded from files/mongo (mirrors the local
# docker-compose mongo). Ingest step 3 reads job records from it. On by default
# so `make up` produces a complete pipeline with zero manual deploys; set
# enabled=false when pointing MONGO_URI at an external MongoDB.
mongo:
  enabled: true
  image: mongo:7
  port: 27017
  db: reckon
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---- API ----
api:
  replicas: 2
  port: 8000
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ---- Dashboard ----
dashboard:
  replicas: 2
  port: 8080
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
