{{- if .Values.pipeline.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "reckon.fullname" . }}-bootstrap
  labels:
    {{- include "reckon.labels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline-bootstrap
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.pipeline.bootstrap.activeDeadlineSeconds }}
  backoffLimit: 1
  ttlSecondsAfterFinished: {{ .Values.pipeline.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pipeline-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        {{- include "reckon.pipelineContainer" . | nindent 8 }}
{{- end }}
