apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "reckon.fullname" . }}-pipeline
  labels:
    {{- include "reckon.labels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline
spec:
  schedule: {{ .Values.pipeline.schedule | quote }}
  concurrencyPolicy: {{ .Values.pipeline.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.pipeline.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.pipeline.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.pipeline.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: {{ .Values.pipeline.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/component: pipeline
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
          containers:
            {{- include "reckon.pipelineContainer" . | nindent 12 }}
