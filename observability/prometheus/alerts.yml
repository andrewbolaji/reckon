groups:
  - name: reckon-pipeline
    rules:
      - alert: PipelineFreshnessBreach
        expr: (time() - pipeline_last_success_timestamp) > 172800 or absent(pipeline_last_success_timestamp)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pipeline freshness signal is missing or over 48 hours old"
          description: >
            No successful pipeline run has been observed, or the last success
            is more than 48 hours old. Run the pipeline to restore freshness.

      - alert: PipelineDbtTestFailure
        expr: pipeline_dbt_test_results{status="fail"} > 0 or pipeline_dbt_test_results{status="error"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "dbt tests failed in the last pipeline run"
          description: >
            {{ $value }} dbt test(s) with status {{ $labels.status }}.
            Check the pipeline logs for details.

      # Raised by the Dagster run failure sensor (orchestration/sensors.py) and
      # by the CLI path (orchestration/report_run.py). Separate from
      # PipelineDbtTestFailure on purpose: a dead source is not a failing test,
      # and an alert body that says the wrong thing sends people to the wrong
      # place. Failures also leave pipeline_last_success_timestamp alone, so a
      # pipeline stuck failing trips PipelineFreshnessBreach as well after 48h.
      - alert: PipelineRunFailure
        expr: pipeline_run_failed > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "The most recent orchestrated pipeline run failed"
          description: >
            A Dagster run of the Reckon pipeline failed, so downstream models
            did not rebuild and the marts are serving the previous run's data.
            Check the failed asset in the Dagster UI, then re-materialise it.
